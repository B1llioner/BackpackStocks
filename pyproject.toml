[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "backpack-stocks"
version = "0.1.0"
description = "Durable Backpack RFQ to Solana/Jupiter arbitrage and delivery-aware paper trading"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<0.29", "cryptography>=44", "solders>=0.26,<0.28", "websockets>=15,<16", "pydantic>=2.11,<3", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-dotenv>=1.1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "mypy>=1.15,<2"]
postgres = ["psycopg[binary,pool]>=3.3,<4"]
jupiter = ["curl-cffi==0.16.3"]

[project.scripts]
backpack-stocks = "backpack_stocks.cli:main"
backpack-pools = "backpack_stocks.pools_cli:main"
backpack-direct = "backpack_stocks.direct_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
backpack_stocks = ["*.json", "migrations/*.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
