[package]
name = "backpack-pool-math"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[lib]
name = "_pool_math"
crate-type = ["rlib", "cdylib"]

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
num-bigint = "0.4.8"
num-traits = "0.2"
pyo3 = { version = "0.27.2", optional = true, features = ["abi3-py312"] }
rayon = "1.12"
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1

