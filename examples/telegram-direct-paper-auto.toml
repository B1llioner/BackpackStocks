mode = "paper"
source = "public"
dex_backend = "raydium"
rebalance = "each_cycle"
database = "state/telegram-direct-paper-pools.sqlite3"
log_file = "state/runtime-auto.jsonl"
backpack_private_reads = true
paper_auto_start = true
paper_notional_usdc = "1000"
telegram_digest_s = 120
telegram_spread_alerts = true
telegram_alert_cooldown_s = 300
poll_s = 3
paper_delivery_s = 120
paper_initial_usdc = "10000"
paper_impact_bps_per_stock = "0.1"
paper_rest_fallback = true
paper_rfq_markup_bps = 20

[direct]
max_pools = 2
via_sol = true
split_pools = true
watched_catalog = "state/watched-pools.json"
max_tick_arrays = 8
concurrency = 2

[policy]
quantity = "10" # Used only when paper_notional_usdc is absent.
max_cost_usdc = "1000"
min_profit_usdc = "5"
min_edge_bps = 50
slippage_bps = 50
backpack_fee_bps = 0
withdrawal_fee = "0.08"
withdrawal_min = "0.16"
withdrawal_semantics = "deduct"
gas_budget_usdc = "0.03"
max_cycles = 100
cooldown_s = 60

[monitor]
enabled = true
quote_backend = "execution"
notional_usdc = "1000" # Search seed, not a monitoring spend ceiling.
auto_size = true
metadata_s = 300
price_batch_s = 10
quote_refresh_s = 5
max_quote_age_s = 15
exploration_s = 30
concurrency = 16 # Pipeline RFQ waits and shared RPC batches; transport limits stay unchanged.
