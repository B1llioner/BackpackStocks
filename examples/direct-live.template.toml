# Backpack RFQ -> Solana -> direct Raydium -> Backpack USDC return.
# Set account-specific verified RFQ/withdrawal terms before the first funded pilot.
mode = "live"
source = "public"
dex_backend = "raydium"
database = "state/direct-live-pilot.sqlite3"
wallet = "REPLACE_WITH_SOLANA_PUBLIC_KEY"
enable_live = false
live_pilot = true
rebalance = "each_cycle"
rpc_url = "https://api.mainnet-beta.solana.com"

[direct]
max_pools = 2
max_tick_arrays = 8
concurrency = 2

[policy]
quantity = "1"
max_cost_usdc = "10"
min_profit_usdc = "0.20"
min_edge_bps = 50
slippage_bps = 50
backpack_fee_bps = 0
withdrawal_fee = "0.08"
withdrawal_min = "0.16"
withdrawal_semantics = "unverified"
gas_budget_usdc = "1"
max_network_lamports = 300000
min_wallet_lamports = 20000000
max_cycles = 1
live_fee_verified = false
live_quantity_mapping_verified = false
live_rfq_verified = false
live_withdrawal_verified = false
