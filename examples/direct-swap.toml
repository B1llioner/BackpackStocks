# Standalone DEX commands use direct.enable_live; they do not run the Backpack FSM.
mode = "paper"
source = "public"
dex_backend = "raydium"
rpc_url = "https://api.mainnet-beta.solana.com"
# wallet = "YOUR_SOLANA_PUBLIC_KEY"

[direct]
enable_live = false
catalog = "research/pool-pricing/catalog-native.json"
journal = "state/direct-swaps.sqlite3"
max_pools = 4
max_tick_arrays = 8
concurrency = 2
compute_units = 500000
priority_micro_lamports = 1000

[policy]
quantity = "10"                   # Maximum input shares for a standalone sell.
max_cost_usdc = "100"              # Standalone buy input / sell output notional cap.
slippage_bps = 50
max_price_impact_pct = "1"
quote_max_age_s = 8
max_network_lamports = 300000
min_wallet_lamports = 20000000
